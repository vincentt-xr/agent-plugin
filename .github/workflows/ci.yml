name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The source lint. Exits non-zero on any violation — a lint that does not fail the build is
      # worse than no lint, because it launders the claim that one exists.
      - name: Lint recognition.md
        run: npm run lint

      # The assembly check. Neither rendered copy is authored; a hand-edit to either fails here
      # with a message naming recognition.md as the place to make the change.
      - name: Assert every generated output matches its source
        run: npm run check

      # QA-F14-08(a) — the recognition cell of the subtractive table — asserts that a scaffolded
      # tree's AGENTS.md carries this repo's assembled section BYTE-FOR-BYTE.
      #
      # THE TAG, NEVER A BRANCH OR A PR REF. Creators receive the tag; asserting against a ref
      # nobody receives is the stale-tag hole QA-F14-G2 exists to close, inverted. So while the
      # tag predates the section the arm reports BLOCKED — not passed, not failed — and flips to
      # a real pass when the tag is cut, with no edit to any test.
      #
      # It is fetched HERE rather than in `toolchain` deliberately. The arm is a fact about the
      # template tag and this repo's assembly — the same repo pair QA-F14-G2 gates — so this is
      # the tier that can feed it. A `toolchain` runner checks out `toolchain` alone.
      #
      # Depth 1, no history, read-only, no credential. `continue-on-error` is NOT set: if the
      # checkout fails the arm FAILS rather than going quiet, so the wiring cannot regress
      # unnoticed. A drifted or malformed section also FAILS — only "the tag has no section at
      # all" is BLOCKED, which is what stops BLOCKED becoming a hiding place.
      - name: Check out v2-template (for the recognition cell)
        uses: actions/checkout@v4
        with:
          repository: vincentt-xr/v2-template
          ref: latest
          path: .v2-template
          fetch-depth: 1

      - name: Test
        env:
          # Consumed by QA-F14-08(a). Absent, the arm reports UNRUN and names this variable.
          QA_F14_TEMPLATE_DIR: ${{ github.workspace }}/.v2-template
        run: npm test

  # A change to the shipped content must move the version — the same class the assembly check owns
  # one level down. There, a generated file may not drift from its source; here, the version a HOST
  # COMPARES AGAINST may not drift from the content it describes.
  #
  # Claude Code's marketplace source is this git repo, so a creator updates by refreshing their
  # local marketplace clone and letting the host compare versions. Content moved, version frozen,
  # and that comparison reports "on latest version" with Update greyed out — truthfully, about
  # stale content. The creator cannot learn from the product that there is anything to get.
  #
  # Scoped like the adversarial review and for its stated reason: it fires only on the files that
  # actually reach a creator. A check that fires on every PR trains people to satisfy it without
  # reading it.
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect the changed files and both sides of package.json
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed-files.txt
          cat /tmp/changed-files.txt
          git show "origin/${{ github.base_ref }}:package.json" > /tmp/base-package.json
          cp package.json /tmp/head-package.json

      - name: Shipped content that changed has moved the version
        run: node build/check-version-bump.mjs /tmp/changed-files.txt /tmp/base-package.json /tmp/head-package.json

  # The adversarial review (implementation.md §4(4)) is the ONLY control that owns the lint's
  # residual, and that residual is a CLASS rather than a list of shapes: any grammatically
  # ordinary declarative sentence passes every syntactic arm. A build-time security pass wrote
  # eleven new hostile sentences and all eleven passed the shipped lint. No grep closes that; five
  # questions answered by a second person is what stands there instead.
  #
  # "The reviewer answers each item explicitly in the PR - a checklist answered by silence is not
  # a control." This job is what makes that sentence mechanical rather than aspirational.
  #
  # It runs ONLY when recognition.md is in the diff. A check that fires on every PR trains people
  # to fill it in without reading it, which is the failure mode it exists to prevent.
  adversarial-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect the changed files
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed-files.txt
          cat /tmp/changed-files.txt

      - name: Capture the PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/pr-body.md

      - name: Every item of the adversarial review is answered
        run: node build/check-adversarial-review.mjs /tmp/changed-files.txt /tmp/pr-body.md
