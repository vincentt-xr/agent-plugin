name: Release

# The package's release path. Runs the same suite CI runs, then the publish gate.
#
# ⚠ THE PUBLISH STEP IS NOT WIRED. The gate below is built, tested, and RUN; the step that would
# push the artifact is absent.
#
# Both ordering rules implementation.md §11 named have since been SATISFIED (2026-09-05): f13
# shipped and its console route is live, and v2-template@latest carries the assembled section —
# the gate below passes today. What remains is mechanical rather than an ordering question:
# uncommenting the step, dropping "private": true from package.json, and giving the job an npm
# token. Until that is done a tag runs the gates and publishes nothing, silently.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint recognition.md
        run: npm run lint

      - name: Assert every generated output matches its source
        run: npm run check

      - name: Test
        run: npm test

      # THE ORDERING RULE, STRUCTURAL RATHER THAN PROMISED. The job refuses to publish if the
      # current v2-template@latest does not contain the assembled section byte-for-byte. Content
      # reaches creators who cannot install FIRST, always, because a package cannot publish until
      # it has. This is FORK-5's "content before packaging" turned into a build failure.
      #
      # It reads the TAG, never main: a correct main behind a lagging tag must still refuse,
      # because creators receive the tag. An unreachable tag also refuses — a gate whose failure
      # mode on a fetch error is "proceed" is not a gate.
      - name: Publish gate — v2-template@latest must already carry the section
        run: npm run publish-gate

      # - name: Publish
      #   NOT WIRED. §11's two ordering rules are satisfied as of 2026-09-05; wiring this needs the
      #   step written, "private": true dropped, and an npm token. Left commented rather than
      #   removed so the absence is visible beside the gate that guards it.
